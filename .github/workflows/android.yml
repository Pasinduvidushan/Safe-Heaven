name: Build Safe Heaven APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses and make sure platform 34 is present
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Make Gradle wrapper executable (lost when pushed from Windows)
        run: chmod +x ./gradlew

      - name: Unit tests (state machine, plate OCR rules, BLE packet, hash chain, PIN vault)
        run: ./gradlew :core:test

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: safe-heaven-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
