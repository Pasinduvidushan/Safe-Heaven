name: Build Safe Heaven APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses and make sure platform 34 is present
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Make Gradle wrapper executable (lost when pushed from Windows)
        run: chmod +x ./gradlew

      - name: Unit tests (state machine, plate OCR rules, BLE packet, hash chain, PIN vault)
        run: ./gradlew :core:test

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --console=plain 2>&1 | tee build.log

      - name: Show the errors on the run summary page
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -E -B1 -A12 '^e: |What went wrong|error:|AAPT|Execution failed|Duplicate class|Manifest merger' build.log | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-and-apk
          path: |
            build.log
            app/build/outputs/apk/debug/app-debug.apk
